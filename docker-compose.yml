services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/support.db
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - support-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional local LLM runtime; set LLM_PROVIDER=ollama and
  # OLLAMA_BASE_URL=http://ollama:11434 in .env to use it.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  support-data:
  ollama-models:
